name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned: Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest is moving to 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Logger, alerts and Apps Script tests
        run: npm test

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Self-update test in real Chromium
        run: npm run test:browser

      - name: Extension version was bumped
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -q '^extension/'; then
            old=$(git show "$base:extension/manifest.json" | jq -r .version)
            new=$(jq -r .version extension/manifest.json)
            if [ "$old" = "$new" ]; then
              echo "::error::extension/ changed but its version is still $old. Bump the version in extension/manifest.json so the server installs the update."
              exit 1
            fi
            echo "Extension version $old -> $new"
          fi
